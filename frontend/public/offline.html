<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>오프라인 · My Concept Map</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #f2eee4; color: #171614;
         font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-align: center; padding: 24px; }
  @media (prefers-color-scheme: dark) { body { background: #0e0e0d; color: #f1ece1; } p { color: #8f897d !important; } }
  h1 { font-size: 22px; margin: 16px 0 6px; }
  p { color: #6e695f; font-size: 15px; line-height: 1.6; margin: 0; }
  button { margin-top: 24px; border: 0; border-radius: 999px; background: #ff5a2b; color: #fff; font-weight: 700; font-size: 15px; padding: 12px 22px; }
</style>
</head>
<body>
  <div>
    <img src="/icons/icon-192.png" width="72" height="72" alt="" style="border-radius:18px" />
    <h1>인터넷에 연결되어 있지 않아요</h1>
    <p>연결되면 다시 세상을 누빌 수 있어요.</p>
    <button onclick="location.reload()">다시 시도</button>
  </div>
</body>
</html>
